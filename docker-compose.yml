

services:

  api-dev:
    build: .
    container_name: biblioteca-dev
    ports:
      - "8001:8000"
    environment:
      - ENV=dev

  api-test:
    build: .
    container_name: biblioteca-test
    ports:
      - "8002:8000"
    environment:
      - ENV=test

  api-prod:
    build: .
    container_name: biblioteca-prod
    ports:
      - "8003:8000"
    environment:
      - ENV=prod

  frontend:
    build: ./frontend
    container_name: biblioteca-frontend
    ports:
      - "3000:3000"
    volumes:
    - ./frontend:/app
    stdin_open: true
    tty: true
    depends_on:
      - api-dev
      - api-test
      - api-prod